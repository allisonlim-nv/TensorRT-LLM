# Paths are relative to --models-root or LLM_MODELS_ROOT.
# These recipes measure aggregate acceptance length with CUDA graphs enabled.
# This matrix targets an eight-GPU B200 node. Kimi's GB300 recipes are excluded.
defaults:
  llm_options:
    max_batch_size: 1
    max_seq_len: 8192
    max_num_tokens: 128
    cuda_graph_config:
      batch_sizes: [1]
      max_batch_size: 1
    enable_chunked_prefill: true
    disable_overlap_scheduler: false
    print_iter_log: true
    kv_cache_config:
      enable_block_reuse: true
      use_kv_cache_manager_v2: true
  chat_template_kwargs:
    enable_thinking: false

cases:
  qwen3-8b: &qwen
    model: Qwen3/Qwen3-8B
    drafter: dspark/dspark_qwen3_8b_block7
    max_draft_len: 7
    llm_options: &qwen_options
      tensor_parallel_size: 1
      moe_expert_parallel_size: 1
      enable_attention_dp: false
      kv_cache_config: &qwen_cache
        free_gpu_memory_fraction: 0.6
    spec_options:
      attention_backend: VANILLA
    notes: >-
      Standalone GQA drafter from TestQwen3_8B.test_dspark. Use chat prompts
      with thinking disabled for the intended drafter training distribution.

  deepseek-v4-flash-nvfp4: &dsv4
    model: DeepSeek-V4-Flash-nvfp4-DSpark
    drafter: DeepSeek-V4-Flash-nvfp4-DSpark
    max_draft_len: 5
    llm_options: &dsv4_options
      attn_backend: TRTLLM
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      enable_attention_dp: true
      custom_tokenizer: deepseek_v4
      moe_config:
        backend: MEGAMOE_CUTEDSL
      kv_cache_config: &dsv4_cache
        free_gpu_memory_fraction: 0.5
        # Target prefill shares scratch pages; draft history keeps ordinary pages.
        enable_swa_scratch_reuse: true
    notes: >-
      Embedded DeepSeek-V4 drafter. Aggregate adaptation of the available
      TP4/EP4 Flash NVFP4 recipe, using one engine for prefill and decode.

  qwen3-8b-explicit-pools:
    <<: *qwen
    llm_options:
      <<: *qwen_options
      kv_cache_config:
        <<: *qwen_cache
        pool_ratio: [1.0]
    notes: Full-feature Qwen recipe with explicit target pool sizing.

  deepseek-v4-flash-nvfp4-explicit-pools: &dsv4_explicit
    <<: *dsv4
    llm_options: &dsv4_explicit_options
      <<: *dsv4_options
      kv_cache_config: &dsv4_explicit_cache
        <<: *dsv4_cache
        # Target groups: SWA, full compressed history, short compressor state.
        # Unified draft storage is reserved separately by the manager.
        pool_ratio: [0.2, 0.7, 0.1]
    notes: Full-feature DSV4 recipe with explicit target pool sizing and SWA scratch.

  deepseek-v4-flash-nvfp4-explicit-pools-no-scratch:
    <<: *dsv4_explicit
    llm_options:
      <<: *dsv4_explicit_options
      kv_cache_config:
        <<: *dsv4_explicit_cache
        enable_swa_scratch_reuse: false
    notes: Scratch-off control for the explicit-pool DSV4 recipe.
