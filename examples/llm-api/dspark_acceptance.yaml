# Paths are relative to --models-root or LLM_MODELS_ROOT.
# These recipes measure aggregate acceptance length in eager mode.
# This matrix targets an eight-GPU B200 node. Kimi's GB300 recipes are excluded.
defaults:
  llm_options:
    max_batch_size: 1
    max_seq_len: 8192
    max_num_tokens: 8192
    cuda_graph_config: null
    enable_chunked_prefill: false
    disable_overlap_scheduler: true
    kv_cache_config:
      enable_block_reuse: false
      use_kv_cache_manager_v2: true
  chat_template_kwargs:
    enable_thinking: false

cases:
  qwen3-8b:
    model: Qwen3/Qwen3-8B
    drafter: dspark/dspark_qwen3_8b_block7
    max_draft_len: 7
    llm_options:
      tensor_parallel_size: 1
      moe_expert_parallel_size: 1
      enable_attention_dp: false
      kv_cache_config:
        free_gpu_memory_fraction: 0.6
    spec_options:
      attention_backend: VANILLA
    notes: >-
      Standalone GQA drafter from TestQwen3_8B.test_dspark. Use chat prompts
      with thinking disabled for the intended drafter training distribution.

  deepseek-v4-flash-nvfp4:
    model: DeepSeek-V4-Flash-nvfp4-DSpark
    drafter: DeepSeek-V4-Flash-nvfp4-DSpark
    max_draft_len: 5
    llm_options:
      attn_backend: TRTLLM
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      enable_attention_dp: true
      custom_tokenizer: deepseek_v4
      moe_config:
        backend: MEGAMOE_CUTEDSL
      kv_cache_config:
        free_gpu_memory_fraction: 0.5
        # Unified draft prefill uses ordinary pages; window eviction remains enabled.
        enable_swa_scratch_reuse: false
    notes: >-
      Embedded DeepSeek-V4 drafter. Aggregate adaptation of the available
      TP4/EP4 Flash NVFP4 recipe, using one engine for prefill and decode.
