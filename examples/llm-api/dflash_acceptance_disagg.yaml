# Paths are relative to --models-root or LLM_MODELS_ROOT.
# B200 recipes run sequentially, using two, four, or eight disjoint GPUs.
# Context and generation each load the target and drafter at the stated TP.
defaults:
  common_options:
    max_batch_size: 1
    max_seq_len: 8192
    max_num_tokens: 128
    tensor_parallel_size: 1
    cuda_graph_config:
      batch_sizes: [1]
      max_batch_size: 1
    enable_chunked_prefill: true
    disable_overlap_scheduler: false
    print_iter_log: true
    kv_cache_config:
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.6
      use_kv_cache_manager_v2: true
    cache_transceiver_config:
      backend: NIXL
      transceiver_runtime: PYTHON
      max_tokens_in_buffer: 8192
  chat_template_kwargs:
    enable_thinking: false

cases:
  qwen3-8b:
    model: Qwen3/Qwen3-8B
    drafter: Qwen3-8B-DFlash-b16
    # The checkpoint's block_size is 16: one seed plus 15 draft tokens.
    max_draft_len: 15
    spec_options:
      attention_backend: VANILLA
    aggregate_case: qwen3-8b
    notes: >-
      DFlash is enabled on both V2 workers. Unified draft pages and history
      metadata are transferred with target KV; VANILLA staging is rebuilt on
      generation. TP1 per worker, two B200s total. Only generation-side
      counters contribute to acceptance length. Implementation is unvalidated.

  qwen3-8b-trtllm:
    model: Qwen3/Qwen3-8B
    drafter: Qwen3-8B-DFlash-b16
    max_draft_len: 15
    spec_options:
      attention_backend: TRTLLM
    aggregate_case: qwen3-8b-trtllm
    notes: >-
      Direct paged draft attention on both workers, without dense staging.
      TP1 per worker, two B200s total.

  qwen3-8b-tp2:
    model: Qwen3/Qwen3-8B
    drafter: Qwen3-8B-DFlash-b16
    max_draft_len: 15
    spec_options:
      attention_backend: VANILLA
    common_options:
      tensor_parallel_size: 2
    aggregate_case: qwen3-8b-tp2
    notes: >-
      Sharded target and draft KV transfer with VANILLA staging restoration.
      TP2 per worker, four B200s total.

  qwen3-4b:
    model: Qwen3/Qwen3-4B
    drafter: Qwen3-4B-DFlash-b16
    max_draft_len: 15
    spec_options:
      attention_backend: VANILLA
    aggregate_case: qwen3-4b
    notes: >-
      Smaller dense target with a five-layer drafter and block size 16.
      TP1 per worker, two B200s total.

  llama3-1-8b:
    model: llama-3.1-model/Llama-3.1-8B-Instruct
    drafter: LLaMA3.1-8B-Instruct-DFlash-UltraChat
    max_draft_len: 9
    spec_options:
      attention_backend: VANILLA
    aggregate_case: llama3-1-8b
    notes: >-
      Llama target with its block-size-10 UltraChat DFlash drafter.
      TP1 per worker, two B200s total.

  qwen3-5-4b:
    model: Qwen3.5-4B
    drafter: Qwen3.5-4B-DFlash
    max_draft_len: 15
    spec_options:
      attention_backend: VANILLA
    common_options:
      max_num_tokens: 512
    aggregate_case: qwen3-5-4b
    notes: >-
      Hybrid GDN/attention state and dense draft KV transfer through the V2
      hybrid manager and Python NIXL. TP1 per worker, two B200s total.

  qwen3-5-27b-tp2:
    model: Qwen3.5-27B
    drafter: Qwen3.5-27B-DFlash
    max_draft_len: 15
    spec_options:
      attention_backend: VANILLA
    common_options:
      max_num_tokens: 512
      tensor_parallel_size: 2
    aggregate_case: qwen3-5-27b-tp2
    notes: >-
      Hybrid state and sharded target/draft KV transfer with VANILLA staging.
      TP2 per worker, four B200s total.

  qwen3-5-35b-a3b-fp8:
    model: Qwen3.5-35B-A3B-FP8
    drafter: Qwen3.5-35B-A3B-DFlash
    max_draft_len: 15
    spec_options:
      attention_backend: VANILLA
    common_options:
      max_num_tokens: 512
      moe_config:
        backend: DEEPGEMM
    aggregate_case: qwen3-5-35b-a3b-fp8
    notes: >-
      FP8 hybrid MoE target with BF16 draft KV and Blackwell DEEPGEMM MoE.
      TP1 per worker, two B200s total.

  qwen3-5-122b-a10b-tp4:
    model: Qwen3.5-122B-A10B
    drafter: Qwen3.5-122B-A10B-DFlash
    max_draft_len: 15
    spec_options:
      attention_backend: VANILLA
    common_options:
      max_num_tokens: 512
      tensor_parallel_size: 4
      moe_expert_parallel_size: 1
      moe_config:
        backend: CUTLASS
    aggregate_case: qwen3-5-122b-a10b-tp4
    notes: >-
      Four B200s per worker, eight total. Each worker loads its own TP4 target
      and drafter; the two groups transfer hybrid state and target/draft KV.
      Memory fit is estimated; this recipe has not been run.
